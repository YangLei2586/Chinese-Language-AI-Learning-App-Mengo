[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "mengo-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<0.117", "uvicorn[standard]>=0.30,<0.32", "sqlalchemy>=2.0,<2.1", "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3"]
[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "httpx>=0.27,<0.29"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
